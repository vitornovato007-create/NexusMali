name: Build NexusMali - MaliSX2 v0.3.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MaliSX2 Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_API: "29"
      ANDROID_NDK_VERSION: "28.2.13676358"
      MALISX2_TAG: "v0.3.3"
      MALISX2_COMMIT: "d0422ed5eb5d8971f118f14d2550ce04aa1a0a5a"
      MESA_COMMIT: "81113fce01b0e3974cdbb2683449e8619d0639e0"

    steps:
      - name: Checkout NexusMali
        uses: actions/checkout@v4

      - name: Install Android SDK and NDK r28c
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang llvm lld libclang-dev \
            python3 python3-pip python3-venv python3-mako python3-yaml \
            git curl unzip zip file binutils pkg-config ninja-build

          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          NDK="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -x "${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          echo "ANDROID_NDK=${NDK}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=${NDK}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Install Rust, Meson and bindgen
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          cargo install bindgen-cli --version 0.71.1 --locked
          python3 -m venv "$HOME/meson-venv"
          "$HOME/meson-venv/bin/pip" install "meson>=1.7,<2"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/meson-venv/bin:$HOME/.cargo/bin:$PATH"
          rustc --version
          bindgen --version
          meson --version
          ninja --version

      - name: Fetch official MaliSX2 v0.3.3 and pinned Mesa
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "${MALISX2_TAG}" https://github.com/bmdhacks/malisx2.git malisx2
          cd malisx2
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$MALISX2_COMMIT"
          git init mesa
          git -C mesa fetch --depth 1 https://github.com/bmdhacks/armsx2-turnip.git "$MESA_COMMIT"
          git -C mesa checkout --detach FETCH_HEAD
          test "$(git -C mesa rev-parse HEAD)" = "$MESA_COMMIT"
          echo "MaliSX2 commit: $ACTUAL"
          echo "Mesa commit: $(git -C mesa rev-parse HEAD)"

      - name: Configure Android cross build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd malisx2
          cat > cross/ci-ndk.ini <<EOF
          [constants]
          ndk = '${ANDROID_NDK}'
          EOF
          meson setup build-android \
            --cross-file cross/ci-ndk.ini \
            --cross-file cross/android-aarch64.ini
          meson configure build-android

      - name: Compile MaliSX2
        shell: bash
        run: |
          set -Eeuo pipefail
          cd malisx2
          ninja -C build-android -v
          DRIVER="build-android/src/libvulkan_malisx2.so"
          test -s "$DRIVER"
          "$TOOLCHAIN/bin/llvm-strip" -o libvulkan_malisx2.so "$DRIVER"
          test -s libvulkan_malisx2.so

      - name: Validate and package NexusMali
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist/package
          cp malisx2/libvulkan_malisx2.so dist/package/libvulkan_NexusMali.so
          file dist/package/libvulkan_NexusMali.so
          readelf -h dist/package/libvulkan_NexusMali.so | tee dist/elf-header.txt
          readelf -h dist/package/libvulkan_NexusMali.so | grep -q 'ELF64'
          readelf -h dist/package/libvulkan_NexusMali.so | grep -q 'AArch64'

          cat > dist/package/meta.json <<'EOF'
          {
            "schemaVersion": 1,
            "name": "NexusMali - MaliSX2",
            "description": "Experimental Android ARM64 package based on official MaliSX2 v0.3.3.",
            "author": "NexusMali Project",
            "packageVersion": "0.3.3-nexus.1",
            "vendor": "NexusMali / bmdhacks MaliSX2",
            "driverVersion": "0.3.3",
            "minApi": 29,
            "libraryName": "libvulkan_NexusMali.so",
            "gpu": "ARM Mali (device compatibility must be tested)",
            "backend": "Mali kbase"
          }
          EOF

          cp malisx2/LICENSE dist/package/MALISX2-LICENSE
          cp malisx2/README.md dist/package/MALISX2-README.md
          cd dist/package
          sha256sum libvulkan_NexusMali.so meta.json > SHA256SUMS
          zip -9 -r ../NexusMali-MaliSX2-v0.3.3-android-arm64.zip .
          cd ../..
          ls -lh dist/
          unzip -l dist/NexusMali-MaliSX2-v0.3.3-android-arm64.zip

      - name: Upload NexusMali package and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: NexusMali-MaliSX2-v0.3.3-android-arm64
          path: |
            dist/NexusMali-MaliSX2-v0.3.3-android-arm64.zip
            dist/elf-header.txt
          if-no-files-found: error
          retention-days: 30
