name: Build NexusMali v0.2.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ANDROID_API: 31
      ANDROID_NDK_VERSION: 29.0.14206865
      SOURCE_ZIP: NexusMali-v0.2.1-source.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-20 \
            llvm-20 \
            llvm-20-dev \
            lld-20 \
            meson \
            ninja-build \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-mako \
            python3-yaml \
            python3-packaging \
            bison \
            flex \
            gettext \
            git \
            unzip \
            zip \
            pkg-config \
            glslang-tools \
            libexpat1-dev \
            zlib1g-dev \
            libdrm-dev \
            libelf-dev \
            libwayland-dev \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxcb-glx0-dev \
            libxcb-shm0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-sync-dev \
            libxshmfence-dev

      - name: Configure Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install requested Android NDK
        run: |
          set -Eeuo pipefail
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Verify toolchains
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:/usr/lib/llvm-20/bin:/usr/bin:/bin"
          command -v llvm-config
          llvm-config --version
          command -v clang
          clang --version
          test -x "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" --version

      - name: Extract source and identify project root
        run: |
          set -Eeuo pipefail
          test -f "$SOURCE_ZIP" || { echo "ERRO: arquivo $SOURCE_ZIP não encontrado na raiz do repositório."; exit 1; }
          mkdir -p nexusmali-source
          unzip -q -o "$SOURCE_ZIP" -d nexusmali-source

          mapfile -t BUILD_SCRIPTS < <(find "$PWD/nexusmali-source" -type f -name build.sh -print)
          if [ "${#BUILD_SCRIPTS[@]}" -ne 1 ]; then
            echo "ERRO: esperava encontrar exatamente um build.sh; encontrei ${#BUILD_SCRIPTS[@]}:"
            printf '%s\n' "${BUILD_SCRIPTS[@]}"
            exit 1
          fi

          ROOT="$(dirname "${BUILD_SCRIPTS[0]}")"
          for required in meson.build meson.options android/package.py; do
            if [ ! -f "$ROOT/$required" ]; then
              echo "ERRO: $required não encontrado na raiz detectada: $ROOT"
              exit 1
            fi
          done

          echo "NEXUSMALI_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Raiz do projeto: $ROOT"
          ls -la "$ROOT"

      - name: Build NexusMali for Android ARM64
        run: |
          set -Eeuo pipefail
          cd "$NEXUSMALI_ROOT"
          export PATH="$HOME/.local/bin:/usr/lib/llvm-20/bin:/usr/bin:/bin"

          echo "=========================================="
          echo "CORRIGINDO FINAIS DE LINHA DO build.sh"
          echo "=========================================="
          # Corrige CRLF (Windows) para LF (Linux), evitando o erro bash\r.
          sed -i 's/\r$//' build.sh
          chmod +x build.sh
          head -n 1 build.sh | cat -A

          echo "=========================================="
          echo "COMPILADOR HOST"
          echo "=========================================="
          command -v llvm-config
          llvm-config --version
          command -v clang
          clang --version

          echo "=========================================="
          echo "COMPILADOR ANDROID"
          echo "=========================================="
          echo "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" --version

          echo "=========================================="
          echo "INICIANDO BUILD LIMPO"
          echo "=========================================="
          CLEAN_BUILD=1 \
          ANDROID_API="$ANDROID_API" \
          ANDROID_NDK="$ANDROID_NDK" \
          ./build.sh "$ANDROID_NDK"

          echo "=========================================="
          echo "ARQUIVOS GERADOS PELO SCRIPT"
          echo "=========================================="
          if [ -d dist-v0.2.1-experimental ]; then
            find dist-v0.2.1-experimental -maxdepth 2 -type f -printf '%p (%s bytes)\n' | sort
          else
            echo "Aviso: dist-v0.2.1-experimental não foi criado pelo build.sh."
          fi

      - name: Validate and package release artifact
        run: |
          set -Eeuo pipefail
          cd "$NEXUSMALI_ROOT"

          DRIVER="build-android-release/libvulkan_panfrost.so"
          if [ ! -f "$DRIVER" ]; then
            echo "ERRO: biblioteca não encontrada em $DRIVER"
            echo "Arquivos parecidos encontrados:"
            find build-android-release -type f -name '*panfrost*.so' -print 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp "$DRIVER" "$GITHUB_WORKSPACE/artifact/libvulkan_panfrost.so"

          if [ -f NOTICE.txt ]; then
            cp NOTICE.txt "$GITHUB_WORKSPACE/artifact/NOTICE.txt"
          elif [ -f licenses/NOTICE.txt ]; then
            cp licenses/NOTICE.txt "$GITHUB_WORKSPACE/artifact/NOTICE.txt"
          else
            printf '%s\n' 'NexusMali experimental build. Preserve Mesa and third-party license notices from the source project.' > "$GITHUB_WORKSPACE/artifact/NOTICE.txt"
          fi

          cat > "$GITHUB_WORKSPACE/artifact/meta.json" <<META
          {
            "name": "NexusMali",
            "version": "0.2.1-experimental",
            "platform": "Android",
            "architecture": "arm64-v8a",
            "android_api": ${ANDROID_API},
            "vulkan_library": "libvulkan_panfrost.so",
            "build_type": "release",
            "source_archive": "${SOURCE_ZIP}"
          }
          META

          cd "$GITHUB_WORKSPACE/artifact"
          sha256sum libvulkan_panfrost.so meta.json NOTICE.txt > SHA256SUMS
          file libvulkan_panfrost.so
          readelf -h libvulkan_panfrost.so | grep -E 'Class:|Machine:'
          grep -q 'ELF 64-bit' <(file libvulkan_panfrost.so)
          readelf -h libvulkan_panfrost.so | grep -q 'AArch64'

          mkdir -p "$GITHUB_WORKSPACE/dist"
          ZIP_OUT="$GITHUB_WORKSPACE/dist/NexusMali-v0.2.1-android-arm64.zip"
          zip -q -j "$ZIP_OUT" \
            libvulkan_panfrost.so \
            meta.json \
            NOTICE.txt \
            SHA256SUMS
          echo "Pacote criado: $ZIP_OUT"
          ls -lh "$ZIP_OUT" libvulkan_panfrost.so

      - name: Upload Android ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusMali-v0.2.1-android-arm64
          path: |
            dist/NexusMali-v0.2.1-android-arm64.zip
            artifact/libvulkan_panfrost.so
            artifact/meta.json
            artifact/NOTICE.txt
            artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
