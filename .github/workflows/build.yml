name: Build NexusMali v0.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NexusMali Android ARM64
    runs-on: ubuntu-24.04

    env:
      ANDROID_API: "31"
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4


      - name: Instalar Android SDK e NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-31"
          sdkmanager "ndk;29.0.14206865"


      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            meson \
            ninja-build \
            cmake \
            pkg-config \
            python3 \
            python3-pip \
            python3-mako \
            python3-yaml \
            bison \
            flex \
            git \
            wget \
            unzip \
            zip \
            xz-utils \
            zstd \
            glslang-tools


      - name: Verificar ferramentas
        run: |
          echo "=========================================="
          echo "GLSLANG"
          echo "=========================================="

          which glslangValidator
          glslangValidator --version

          echo ""
          echo "=========================================="
          echo "MESON"
          echo "=========================================="

          meson --version

          echo ""
          echo "=========================================="
          echo "NINJA"
          echo "=========================================="

          ninja --version


      - name: Configurar NDK ARM64
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          CC="$TOOLCHAIN/bin/aarch64-linux-android31-clang"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android31-clang++"

          if [ ! -x "$CC" ]; then
            echo "ERRO: compilador ARM64 não encontrado:"
            echo "$CC"
            exit 1
          fi

          if [ ! -x "$CXX" ]; then
            echo "ERRO: compilador C++ ARM64 não encontrado:"
            echo "$CXX"
            exit 1
          fi

          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "NM=$TOOLCHAIN/bin/llvm-nm" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"

          echo "PATH=$TOOLCHAIN/bin:$PATH" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "NDK"
          echo "=========================================="

          echo "$NDK"

          echo ""
          echo "=========================================="
          echo "CLANG ARM64"
          echo "=========================================="

          "$CC" --version


      - name: Extrair source NexusMali
        run: |
          ZIP="$GITHUB_WORKSPACE/NexusMali-v0.2-source.zip"
          SOURCE="$GITHUB_WORKSPACE/nexusmali-source"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: arquivo NexusMali-v0.2-source.zip não encontrado."
            exit 1
          fi

          rm -rf "$SOURCE"

          mkdir -p "$SOURCE"

          unzip -q "$ZIP" -d "$SOURCE"

          echo "=========================================="
          echo "SOURCE EXTRAÍDO"
          echo "=========================================="

          find "$SOURCE" -maxdepth 2 -type f -print | sort


      - name: Preparar source
        run: |
          SOURCE="$GITHUB_WORKSPACE/nexusmali-source"

          echo "=========================================="
          echo "VERIFICANDO SOURCE"
          echo "=========================================="

          if [ ! -f "$SOURCE/build.sh" ]; then
            echo "ERRO: build.sh não encontrado na raiz esperada:"
            echo "$SOURCE"

            echo ""
            echo "Arquivos encontrados:"
            find "$SOURCE" -maxdepth 3 -type f -print | sort

            exit 1
          fi

          if [ ! -f "$SOURCE/meson.build" ]; then
            echo "ERRO: meson.build não encontrado."
            exit 1
          fi

          chmod +x "$SOURCE/build.sh"

          echo "NEXUSMALI_ROOT=$SOURCE" >> "$GITHUB_ENV"

          echo ""
          echo "Source:"
          echo "$SOURCE"

          echo ""
          echo "build.sh:"
          ls -lh "$SOURCE/build.sh"

          echo ""
          echo "meson.build:"
          ls -lh "$SOURCE/meson.build"


      - name: Compilar NexusMali
        working-directory: ${{ env.NEXUSMALI_ROOT }}
        run: |
          export PATH="$TOOLCHAIN/bin:$PATH"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android31-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android31-clang++"

          export AR="$TOOLCHAIN/bin/llvm-ar"
          export NM="$TOOLCHAIN/bin/llvm-nm"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"

          export ANDROID_API=31
          export ANDROID_NDK_VERSION=29.0.14206865

          export CFLAGS="--target=aarch64-linux-android31 -fPIC"
          export CXXFLAGS="--target=aarch64-linux-android31 -fPIC"

          echo "=========================================="
          echo "BUILD NEXUSMALI"
          echo "=========================================="

          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "ANDROID_API=$ANDROID_API"
          echo "ANDROID_NDK_VERSION=$ANDROID_NDK_VERSION"

          echo ""
          echo "=========================================="
          echo "GLSLANG"
          echo "=========================================="

          glslangValidator --version

          echo ""
          echo "=========================================="
          echo "EXECUTANDO build.sh"
          echo "=========================================="

          ./build.sh


      - name: Procurar driver gerado
        run: |
          SOURCE="$GITHUB_WORKSPACE/nexusmali-source"

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          echo "=========================================="
          echo "PROCURANDO DRIVER"
          echo "=========================================="

          DRIVER=$(find "$SOURCE" \
            -type f \
            \( \
              -name "libvulkan_panfrost.so" \
              -o -name "vulkan.mt8500.so" \
            \) \
            -print \
            -quit)

          if [ -z "$DRIVER" ]; then
            echo "ERRO: driver Vulkan não foi encontrado."

            echo ""
            echo "Bibliotecas .so encontradas:"

            find "$SOURCE" \
              -type f \
              -name "*.so" \
              -print \
              | sort

            exit 1
          fi

          echo "Driver encontrado:"
          echo "$DRIVER"

          cp "$DRIVER" \
            "$GITHUB_WORKSPACE/artifact/libvulkan_panfrost.so"


      - name: Validar driver
        run: |
          DRIVER="$GITHUB_WORKSPACE/artifact/libvulkan_panfrost.so"

          echo "=========================================="
          echo "ARQUIVO"
          echo "=========================================="

          file "$DRIVER"

          echo ""
          echo "=========================================="
          echo "ARQUITETURA"
          echo "=========================================="

          readelf -h "$DRIVER" \
            | grep -E "Class|Machine"

          echo ""
          echo "=========================================="
          echo "DEPENDÊNCIAS"
          echo "=========================================="

          readelf -d "$DRIVER" \
            | grep NEEDED || true

          echo ""
          echo "=========================================="
          echo "SONAME"
          echo "=========================================="

          readelf -d "$DRIVER" \
            | grep SONAME || true

          echo ""
          echo "=========================================="
          echo "RUNPATH"
          echo "=========================================="

          readelf -d "$DRIVER" \
            | grep -E "RPATH|RUNPATH" || true


      - name: Criar meta.json
        run: |
          cat > "$GITHUB_WORKSPACE/artifact/meta.json" <<'EOF'
          {
            "schemaVersion": 1,
            "name": "NexusMali v0.2",
            "description": "NexusMali PanVK Bifrost/Kbase driver targeting Mali-G76 MP12 on Exynos 9820.",
            "author": "NexusMali Project",
            "packageVersion": "0.2",
            "vendor": "NexusMali / Mesa PanVK",
            "driverVersion": "26.3.0-devel",
            "minApi": 31,
            "libraryName": "libvulkan_panfrost.so",
            "gpu": "Mali-G76 MP12",
            "architecture": "Bifrost",
            "backend": "Kbase",
            "deviceNode": "/dev/mali0"
          }
          EOF

          cat "$GITHUB_WORKSPACE/artifact/meta.json"


      - name: Copiar NOTICE
        run: |
          SOURCE="$GITHUB_WORKSPACE/nexusmali-source"

          if [ -f "$SOURCE/THIRD_PARTY_NOTICES.md" ]; then
            cp "$SOURCE/THIRD_PARTY_NOTICES.md" \
              "$GITHUB_WORKSPACE/artifact/NOTICE.txt"
          elif [ -f "$SOURCE/NOTICE.txt" ]; then
            cp "$SOURCE/NOTICE.txt" \
              "$GITHUB_WORKSPACE/artifact/NOTICE.txt"
          else
            echo "Nenhum NOTICE encontrado."
          fi


      - name: Gerar SHA256
        working-directory: artifact
        run: |
          sha256sum libvulkan_panfrost.so meta.json > SHA256SUMS

          if [ -f NOTICE.txt ]; then
            sha256sum NOTICE.txt >> SHA256SUMS
          fi

          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cat SHA256SUMS


      - name: Criar pacote final
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"

          cd "$GITHUB_WORKSPACE/artifact"

          if [ -f NOTICE.txt ]; then
            zip -9 \
              "$GITHUB_WORKSPACE/dist/NexusMali-v0.2-android-arm64.zip" \
              libvulkan_panfrost.so \
              meta.json \
              SHA256SUMS \
              NOTICE.txt
          else
            zip -9 \
              "$GITHUB_WORKSPACE/dist/NexusMali-v0.2-android-arm64.zip" \
              libvulkan_panfrost.so \
              meta.json \
              SHA256SUMS
          fi

          echo ""
          echo "=========================================="
          echo "PACOTE FINAL"
          echo "=========================================="

          ls -lh "$GITHUB_WORKSPACE/dist/"


      - name: Enviar artefato
        uses: actions/upload-artifact@v4
        with:
          name: NexusMali-v0.2-android-arm64
          path: dist/NexusMali-v0.2-android-arm64.zip
          if-no-files-found: error
          retention-days: 30
