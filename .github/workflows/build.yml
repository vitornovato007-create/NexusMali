name: Build NexusMali v0.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NexusMali v0.2 - Android ARM64
    runs-on: ubuntu-24.04

    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_API: 31

    steps:

      # ============================================================
      # 1. BAIXAR O CÓDIGO DO REPOSITÓRIO
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURAR JAVA 17
      # ============================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. CONFIGURAR ANDROID SDK
      #
      # Não instalamos NDK aqui.
      # A instalação do NDK será feita separadamente pelo sdkmanager.
      # ============================================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false


      # ============================================================
      # 4. VERIFICAR O ANDROID SDK
      # ============================================================

      - name: Check Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "ANDROID_HOME"
          echo "=========================================="

          echo "${ANDROID_HOME}"

          echo "=========================================="
          echo "SDKMANAGER"
          echo "=========================================="

          which sdkmanager
          sdkmanager --version

          echo "=========================================="
          echo "ADB"
          echo "=========================================="

          which adb
          adb version


      # ============================================================
      # 5. INSTALAR ANDROID PLATFORM API 31
      #    E NDK r29
      # ============================================================

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "=========================================="
          echo "INSTALANDO ANDROID API ${ANDROID_API}"
          echo "=========================================="

          sdkmanager \
            "platforms;android-${ANDROID_API}"

          echo "=========================================="
          echo "INSTALANDO NDK ${ANDROID_NDK_VERSION}"
          echo "=========================================="

          sdkmanager \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "=========================================="
          echo "PACOTES INSTALADOS"
          echo "=========================================="

          sdkmanager --list_installed

          echo "=========================================="
          echo "NDK"
          echo "=========================================="

          ls -lah "${ANDROID_HOME}/ndk/"

          echo "=========================================="
          echo "NDK ESPERADO"
          echo "=========================================="

          if [ ! -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" ]; then
            echo "ERRO: NDK ${ANDROID_NDK_VERSION} não foi instalado."
            exit 1
          fi

          echo "NDK encontrado com sucesso."


      # ============================================================
      # 6. CONFIGURAR TOOLCHAIN DO NDK
      # ============================================================

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euxo pipefail

          NDK="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64"

          echo "ANDROID_NDK=${NDK}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=${TOOLCHAIN}" >> "$GITHUB_ENV"

          echo "${TOOLCHAIN}/bin" >> "$GITHUB_PATH"

          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="

          echo "${NDK}"

          echo "=========================================="
          echo "TOOLCHAIN"
          echo "=========================================="

          echo "${TOOLCHAIN}"

          echo "=========================================="
          echo "CLANG"
          echo "=========================================="

          "${TOOLCHAIN}/bin/clang" --version

          echo "=========================================="
          echo "LLVM AR"
          echo "=========================================="

          "${TOOLCHAIN}/bin/llvm-ar" --version


      # ============================================================
      # 7. EXTRAIR O SOURCE DO NEXUSMALI
      # ============================================================

      - name: Extract NexusMali source
        shell: bash
        run: |
          set -euxo pipefail

          ZIP="${GITHUB_WORKSPACE}/NexusMali-v0.2-source.zip"

          echo "=========================================="
          echo "PROCURANDO SOURCE"
          echo "=========================================="

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: NexusMali-v0.2-source.zip não encontrado."

            echo ""
            echo "Arquivos disponíveis no repositório:"
            find "${GITHUB_WORKSPACE}" \
              -maxdepth 3 \
              -type f \
              -print

            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          echo ""
          echo "Conteúdo do ZIP:"
          unzip -l "$ZIP"

          rm -rf "${GITHUB_WORKSPACE}/nexusmali-source"

          mkdir -p "${GITHUB_WORKSPACE}/nexusmali-source"

          unzip -q "$ZIP" \
            -d "${GITHUB_WORKSPACE}/nexusmali-source"

          echo ""
          echo "=========================================="
          echo "SOURCE EXTRAÍDO"
          echo "=========================================="

          find "${GITHUB_WORKSPACE}/nexusmali-source" \
            -maxdepth 5 \
            -type f \
            -print | sort


      # ============================================================
      # 8. LOCALIZAR A RAIZ REAL DO SOURCE
      #
      # Primeiro procura build.sh.
      # ============================================================

      - name: Detect source root
        shell: bash
        run: |
          set -euxo pipefail

          SOURCE="${GITHUB_WORKSPACE}/nexusmali-source"

          echo "=========================================="
          echo "PROCURANDO build.sh"
          echo "=========================================="

          ROOT="$(
            find "$SOURCE" \
              -type f \
              -name 'build.sh' \
              -exec dirname {} \; \
              | head -1
          )"

          if [ -z "$ROOT" ]; then

            echo ""
            echo "ERRO: build.sh não foi encontrado."
            echo ""
            echo "Isso significa que o ZIP provavelmente"
            echo "possui outro sistema de build."
            echo ""
            echo "Procurando arquivos de build alternativos:"
            echo ""

            find "$SOURCE" \
              -type f \
              \( \
                -name 'meson.build' \
                -o -name 'CMakeLists.txt' \
                -o -name 'Makefile' \
                -o -name 'configure' \
              \) \
              -print

            echo ""
            echo "Estrutura completa:"
            find "$SOURCE" \
              -maxdepth 6 \
              -type f \
              -print | sort

            exit 1
          fi

          echo "=========================================="
          echo "SOURCE ROOT"
          echo "=========================================="

          echo "$ROOT"

          echo "NEXUSMALI_ROOT=$ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # 9. PREPARAR SOURCE
      # ============================================================

      - name: Prepare source
        shell: bash
        run: |
          set -euxo pipefail

          cd "$NEXUSMALI_ROOT"

          echo "=========================================="
          echo "DIRETÓRIO DO SOURCE"
          echo "=========================================="

          pwd

          echo ""
          echo "=========================================="
          echo "ARQUIVOS"
          echo "=========================================="

          find . \
            -maxdepth 3 \
            -type f \
            -print | sort

          echo ""
          echo "=========================================="
          echo "build.sh"
          echo "=========================================="

          ls -lh build.sh

          chmod +x build.sh

          file build.sh


      # ============================================================
      # 10. CONFIGURAR COMPILADOR ANDROID ARM64
      # ============================================================

      - name: Configure ARM64 compiler
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${TOOLCHAIN}/bin:${PATH}"

          CC="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"
          CXX="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"

          if [ ! -x "$CC" ]; then
            echo "ERRO: clang ARM64 não encontrado:"
            echo "$CC"
            exit 1
          fi

          if [ ! -x "$CXX" ]; then
            echo "ERRO: clang++ ARM64 não encontrado:"
            echo "$CXX"
            exit 1
          fi

          echo "CC=${CC}" >> "$GITHUB_ENV"
          echo "CXX=${CXX}" >> "$GITHUB_ENV"

          echo "AR=${TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "NM=${TOOLCHAIN}/bin/llvm-nm" >> "$GITHUB_ENV"
          echo "STRIP=${TOOLCHAIN}/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "OBJCOPY=${TOOLCHAIN}/bin/llvm-objcopy" >> "$GITHUB_ENV"
          echo "RANLIB=${TOOLCHAIN}/bin/llvm-ranlib" >> "$GITHUB_ENV"

          echo "CFLAGS=--target=aarch64-linux-android${ANDROID_API} -fPIC" >> "$GITHUB_ENV"

          echo "CXXFLAGS=--target=aarch64-linux-android${ANDROID_API} -fPIC" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "COMPILADOR"
          echo "=========================================="

          "$CC" --version

          echo ""
          echo "=========================================="
          echo "TARGET"
          echo "=========================================="

          "$CC" \
            --target=aarch64-linux-android${ANDROID_API} \
            -dumpmachine


      # ============================================================
      # 11. INSTALAR DEPENDÊNCIAS DE BUILD
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            lld \
            meson \
            ninja-build \
            python3 \
            python3-pip \
            python3-mako \
            python3-yaml \
            pkg-config \
            bison \
            flex \
            cmake \
            git \
            wget \
            unzip \
            xz-utils \
            zstd

          echo "=========================================="
          echo "MESON"
          echo "=========================================="

          meson --version

          echo ""
          echo "=========================================="
          echo "NINJA"
          echo "=========================================="

          ninja --version


      # ============================================================
      # 12. COMPILAR NEXUSMALI
      # ============================================================

      - name: Build NexusMali
        shell: bash
        run: |
          set -euxo pipefail

          cd "$NEXUSMALI_ROOT"

          export PATH="${TOOLCHAIN}/bin:${PATH}"

          export CC="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang"

          export CXX="${TOOLCHAIN}/bin/aarch64-linux-android${ANDROID_API}-clang++"

          export AR="${TOOLCHAIN}/bin/llvm-ar"
          export NM="${TOOLCHAIN}/bin/llvm-nm"
          export STRIP="${TOOLCHAIN}/bin/llvm-strip"
          export OBJCOPY="${TOOLCHAIN}/bin/llvm-objcopy"
          export RANLIB="${TOOLCHAIN}/bin/llvm-ranlib"

          export CFLAGS="--target=aarch64-linux-android${ANDROID_API} -fPIC"

          export CXXFLAGS="--target=aarch64-linux-android${ANDROID_API} -fPIC"

          echo "=========================================="
          echo "INICIANDO BUILD NEXUSMALI"
          echo "=========================================="

          echo "CC=${CC}"
          echo "CXX=${CXX}"
          echo "ANDROID_API=${ANDROID_API}"
          echo "ANDROID_NDK_VERSION=${ANDROID_NDK_VERSION}"

          echo ""
          echo "=========================================="
          echo "EXECUTANDO build.sh"
          echo "=========================================="

          ./build.sh


      # ============================================================
      # 13. LOCALIZAR LIBVULKAN_PANFROST.SO
      # ============================================================

      - name: Find generated Vulkan driver
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/artifact"

          echo "=========================================="
          echo "PROCURANDO DRIVER GERADO"
          echo "=========================================="

          DRIVER="$(
            find "$NEXUSMALI_ROOT" \
              -type f \
              -name 'libvulkan_panfrost.so' \
              -print \
              | head -1
          )"

          if [ -z "$DRIVER" ]; then

            echo "ERRO: libvulkan_panfrost.so não foi gerado."

            echo ""
            echo "Bibliotecas encontradas:"
            find "$NEXUSMALI_ROOT" \
              -type f \
              -name '*.so' \
              -print

            exit 1
          fi

          echo "Driver encontrado:"
          echo "$DRIVER"

          cp "$DRIVER" \
            "${GITHUB_WORKSPACE}/artifact/libvulkan_panfrost.so"


      # ============================================================
      # 14. VALIDAR ELF ARM64
      # ============================================================

      - name: Validate ARM64 Vulkan driver
        shell: bash
        run: |
          set -euxo pipefail

          DRIVER="${GITHUB_WORKSPACE}/artifact/libvulkan_panfrost.so"

          echo "=========================================="
          echo "FILE"
          echo "=========================================="

          file "$DRIVER"

          echo ""
          echo "=========================================="
          echo "ELF HEADER"
          echo "=========================================="

          readelf -h "$DRIVER"

          echo ""
          echo "=========================================="
          echo "DEPENDÊNCIAS"
          echo "=========================================="

          readelf -d "$DRIVER" \
            | grep NEEDED || true

          echo ""
          echo "=========================================="
          echo "SONAME"
          echo "=========================================="

          readelf -d "$DRIVER" \
            | grep SONAME || true

          echo ""
          echo "=========================================="
          echo "RUNPATH / RPATH"
          echo "=========================================="

          readelf -d "$DRIVER" \
            | grep -E 'RPATH|RUNPATH' || true

          echo ""
          echo "=========================================="
          echo "ARQUITETURA"
          echo "=========================================="

          readelf -h "$DRIVER" \
            | grep -E 'Class|Machine'


      # ============================================================
      # 15. CRIAR META.JSON
      # ============================================================

      - name: Create metadata
        shell: bash
        run: |
          set -euxo pipefail

          cat > "${GITHUB_WORKSPACE}/artifact/meta.json" <<'EOF'
          {
            "schemaVersion": 1,
            "name": "NexusMali v0.2",
            "description": "NexusMali PanVK Bifrost/Kbase driver targeting Mali-G76 MP12 on Exynos 9820.",
            "author": "NexusMali Project",
            "packageVersion": "0.2",
            "vendor": "NexusMali / Mesa PanVK",
            "driverVersion": "26.3.0-devel",
            "minApi": 31,
            "libraryName": "libvulkan_panfrost.so",
            "gpu": "Mali-G76 MP12",
            "architecture": "Bifrost",
            "backend": "Kbase",
            "deviceNode": "/dev/mali0"
          }
          EOF

          cat "${GITHUB_WORKSPACE}/artifact/meta.json"


      # ============================================================
      # 16. COPIAR NOTICE
      # ============================================================

      - name: Copy notices
        shell: bash
        run: |
          set -euxo pipefail

          if [ -f "$NEXUSMALI_ROOT/NOTICE.txt" ]; then

            cp "$NEXUSMALI_ROOT/NOTICE.txt" \
              "${GITHUB_WORKSPACE}/artifact/NOTICE.txt"

          elif [ -f "$NEXUSMALI_ROOT/THIRD_PARTY_NOTICES.md" ]; then

            cp "$NEXUSMALI_ROOT/THIRD_PARTY_NOTICES.md" \
              "${GITHUB_WORKSPACE}/artifact/NOTICE.txt"

          else

            echo "Nenhum NOTICE encontrado."

          fi


      # ============================================================
      # 17. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}/artifact"

          sha256sum \
            * \
            > SHA256SUMS

          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cat SHA256SUMS


      # ============================================================
      # 18. CRIAR ZIP FINAL
      # ============================================================

      - name: Create final package
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/dist"

          cd "${GITHUB_WORKSPACE}/artifact"

          if [ -f NOTICE.txt ]; then

            zip -9 \
              "${GITHUB_WORKSPACE}/dist/NexusMali-v0.2-android-arm64.zip" \
              libvulkan_panfrost.so \
              meta.json \
              SHA256SUMS \
              NOTICE.txt

          else

            zip -9 \
              "${GITHUB_WORKSPACE}/dist/NexusMali-v0.2-android-arm64.zip" \
              libvulkan_panfrost.so \
              meta.json \
              SHA256SUMS

          fi

          echo ""
          echo "=========================================="
          echo "PACOTE FINAL"
          echo "=========================================="

          ls -lh "${GITHUB_WORKSPACE}/dist/"


      # ============================================================
      # 19. PUBLICAR ARTIFACT
      # ============================================================

      - name: Upload compiled NexusMali
        uses: actions/upload-artifact@v4
        with:
          name: NexusMali-v0.2-android-arm64
          path: dist/NexusMali-v0.2-android-arm64.zip
          if-no-files-found: error
          retention-days: 30
